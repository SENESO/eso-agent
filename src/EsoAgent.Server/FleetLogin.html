<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%20%20%20%3C%21--%20EsoAgent%20golden%20wing%20%E2%80%94%20owner%20pick%202026-11-18.%20Generated%20by%20scripts%2Frender-brand.py%3B%20edit%20geometry%20there.%20--%3E%20%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22gold%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F7DC8F%22%2F%3E%3Cstop%20offset%3D%220.45%22%20stop-color%3D%22%23E9BE57%22%2F%3E%3Cstop%20offset%3D%220.75%22%20stop-color%3D%22%23C9962E%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239A7418%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%20%20%20%3Cg%20fill%3D%22url%28%23gold%29%22%3E%20%20%20%3Cpolygon%20points%3D%2220%2C52%2068%2C26%2058%2C36%2029%2C50%22%2F%3E%20%20%20%3Cpolygon%20points%3D%2228%2C54%2064%2C36%2054%2C48%2034%2C57%22%2F%3E%20%20%20%3Cpolygon%20points%3D%2235%2C59%2054%2C49%2048%2C60%2037%2C66%22%2F%3E%20%20%20%3Cpolygon%20points%3D%2236%2C67%2051%2C62%2046%2C69%2036%2C72%22%2F%3E%20%20%20%3Cpolygon%20points%3D%2221%2C54%2038%2C60%2034%2C79%22%2F%3E%20%20%20%3C%2Fg%3E%20%20%20%3Cg%20stroke%3D%22url%28%23gold%29%22%3E%20%20%20%3Cpath%20d%3D%22M%2056.4%2C41.0%20A%2013%2C13%200%200%201%2056.4%2C61.0%22%20fill%3D%22none%22%20stroke-width%3D%225.0%22%20stroke-linecap%3D%22round%22%2F%3E%20%20%20%3Cpath%20d%3D%22M%2062.8%2C33.4%20A%2023%2C23%200%200%201%2062.8%2C68.6%22%20fill%3D%22none%22%20stroke-width%3D%225.0%22%20stroke-linecap%3D%22round%22%2F%3E%20%20%20%3Cpath%20d%3D%22M%2069.2%2C25.7%20A%2033%2C33%200%200%201%2069.2%2C76.3%22%20fill%3D%22none%22%20stroke-width%3D%225.0%22%20stroke-linecap%3D%22round%22%2F%3E%20%20%20%3C%2Fg%3E%20%3C%2Fsvg%3E%20">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EsoAgent Fleet — Owner Login</title>
<style>
  /* ESO:TOKENS */
/* EsoAgent design tokens — the single source for every surface.
   Web panels consume the light theme (:root). The dark variant below is the
   refined-dark token set the desktop App's resource dictionary mirrors
   (src/EsoAgent.App/Themes/EsoTokens.axaml). Gold is an accent only:
   primary actions, active states, the wing mark — never a theme.
   Contrast gate: every text/background pair >= 4.5:1, verified by
   scripts/check-contrast.py. Semantic colours pair a fill value (dots,
   borders) with a -tx value darkened/lightened until it passes as text. */
:root {
  /* surfaces & text (light — the website law: soft, comfortable, light) */
  --bg: #F7F5F1;
  --surface: #FFFFFF;
  --surface-2: #FBFAF7;
  --line: #E6E1D6;
  --txt: #20242E;
  --mut: #646B76;
  /* brand accent */
  --acc: #8A6508;
  --acc-solid: #E3B341;
  --on-acc: #1A1A1A;
  --acc-bg: #FAF1DA;
  /* state semantics: fill / text-safe / tint */
  --ok: #2F9E44;
  --ok-tx: #1E7A34;
  --ok-bg: #E7F5EC;
  --warn: #E08A00;
  --warn-tx: #8F5E00;
  --warn-bg: #FBF0DC;
  --bad: #D64545;
  --bad-tx: #B02A2A;
  --bad-bg: #FBEAEA;
  --bad-bg-strong: #F9DADA;
  --mut-bg: #F0EEE8;
  /* type scale (system UI stack on both platforms) */
  --fs-1: 12px;
  --fs-2: 13px;
  --fs-3: 14px;
  --fs-4: 16px;
  --fs-5: 20px;
  --fs-6: 24px;
  /* spacing: 4-pt scale */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  /* radii: 8 controls, 12 cards, 999 badges */
  --r-ctl: 8px;
  --r-card: 12px;
  --r-badge: 999px;
  /* elevation: one soft shadow level, dialogs/menus only */
  --shadow: 0 8px 30px rgba(32, 36, 46, .16), 0 2px 6px rgba(32, 36, 46, .10);
  --row-h: 36px;
}
[data-theme="dark"] {
  /* refined dark — same tokens, App variant */
  --bg: #131519;
  --surface: #1B1E24;
  --surface-2: #21252D;
  --line: #2C3038;
  --txt: #ECEEF2;
  --mut: #9BA1AC;
  --acc: #E3B341;
  --acc-solid: #E3B341;
  --on-acc: #1A1A1A;
  --acc-bg: #33290F;
  --ok: #3FB950;
  --ok-tx: #4CC38A;
  --ok-bg: #14301F;
  --warn: #D29922;
  --warn-tx: #E3B341;
  --warn-bg: #38300F;
  --bad: #F87171;
  --bad-tx: #F08A8A;
  --bad-bg: #3A1F22;
  --bad-bg-strong: #4A262B;
  --mut-bg: #262A31;
  --shadow: 0 8px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
}
  /* /ESO:TOKENS */
  /* ESO:LOGIN */
/* EsoAgent login pages — light theme on the shared tokens. The form markup is
   injected by the server (Panel.cs / Dashboard.cs) as bare label/input/button
   elements inside .card, so this sheet styles elements, not classes.
   Synced into FleetLogin.html and DashboardLogin.html by
   scripts/sync-web-assets.py; edit here, never in the HTML copies. */
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: var(--sp-4); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: var(--sp-6); width: min(94vw, 380px); }
h1 { font-size: var(--fs-5); margin: 0 0 var(--sp-1); text-align: center; }
p.sub { color: var(--mut); margin: 0 0 var(--sp-5); font-size: var(--fs-2); text-align: center; }
label { display: block; font-size: var(--fs-2); font-weight: 600; margin-bottom: var(--sp-1); color: var(--mut); }
input { width: 100%; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); color: var(--txt); margin-bottom: var(--sp-4); font: inherit; }
button { width: 100%; padding: var(--sp-3); border: 1px solid var(--acc-solid); border-radius: var(--r-ctl); background: var(--acc-solid); color: var(--on-acc); font-weight: 700; cursor: pointer; font: inherit; }
button:hover { filter: brightness(1.04); }
.error { background: var(--bad-bg); border: 1px solid var(--bad); color: var(--bad-tx); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-ctl); margin-bottom: var(--sp-4); font-size: var(--fs-2); font-weight: 600; }
.langrow { text-align: right; margin-bottom: var(--sp-2); }
.langrow button { width: auto; padding: var(--sp-1) var(--sp-3); background: var(--surface); border: 1px solid var(--line); color: var(--txt); font-weight: 400; }
.brandwrap { display: flex; justify-content: center; margin-bottom: var(--sp-2); }
.brandmark { display: inline-flex; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(32, 36, 46, .18); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
button, input { transition: border-color .15s ease, background .15s ease; }
  /* /ESO:LOGIN */
</style>
</head>
<body>
  <div class="card">
    <div class="langrow"><button type="button" id="langToggle">العربية</button></div>
    <div style="display:flex;justify-content:center;margin-bottom:.6rem"><span style="display:inline-flex;border-radius:10px;overflow:hidden"><svg width="30" height="30" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">      <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7DC8F"/><stop offset="0.45" stop-color="#E9BE57"/><stop offset="0.75" stop-color="#C9962E"/><stop offset="1" stop-color="#9A7418"/></linearGradient></defs>   <g fill="url(#gold)">   <polygon points="20,52 68,26 58,36 29,50"/>   <polygon points="28,54 64,36 54,48 34,57"/>   <polygon points="35,59 54,49 48,60 37,66"/>   <polygon points="36,67 51,62 46,69 36,72"/>   <polygon points="21,54 38,60 34,79"/>   </g>   <g stroke="url(#gold)">   <path d="M 56.4,41.0 A 13,13 0 0 1 56.4,61.0" fill="none" stroke-width="5.0" stroke-linecap="round"/>   <path d="M 62.8,33.4 A 23,23 0 0 1 62.8,68.6" fill="none" stroke-width="5.0" stroke-linecap="round"/>   <path d="M 69.2,25.7 A 33,33 0 0 1 69.2,76.3" fill="none" stroke-width="5.0" stroke-linecap="round"/>   </g> </svg></span></div><h1 data-i18n="title">EsoAgent Fleet</h1>
    <p class="sub" data-i18n="sub">Fleet owner panel — the owner's master controls live here.</p>
    <!--ERROR-->
    <!--FORM-->
  </div>
<script>
  const L = {
    en: { title: 'EsoAgent Fleet', sub: "Fleet owner panel — the owner's master controls live here.", pw: 'Owner password', signin: 'Sign in', code: 'Authenticator code (6 digits)', verify: 'Verify', codesub: 'Enter the 6-digit code from your authenticator app.' },
    ar: { title: 'EsoAgent Fleet', sub: 'لوحة مالك الأسطول — عناصر التحكم الرئيسية للمالك هنا.', pw: 'كلمة مرور المالك', signin: 'تسجيل الدخول', code: 'رمز المصادقة (٦ أرقام)', verify: 'تحقق', codesub: 'أدخل الرمز المكوّن من ٦ أرقام من تطبيق المصادقة.' }
  };
  let lang = localStorage.getItem('eso-lang') || 'en';
  function applyLang() {
    const d = L[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { if (d[el.dataset.i18n]) el.textContent = d[el.dataset.i18n]; });
    document.getElementById('langToggle').textContent = lang === 'ar' ? 'English' : 'العربية';
  }
  document.getElementById('langToggle').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('eso-lang', lang); applyLang(); };
  applyLang();
</script>
</body>
</html>
